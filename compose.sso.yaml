services:
  qodex:
    environment:
      QODEX_PROXY_TOKEN: "${QODEX_PROXY_TOKEN:?Set a random shared proxy token}"
  caddy:
    environment:
      QODEX_PROXY_TOKEN: "${QODEX_PROXY_TOKEN:?Set a random shared proxy token}"
    depends_on:
      - auth
    volumes:
      - ./deploy/Caddyfile.sso:/etc/caddy/Caddyfile:ro
  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${QODEX_OIDC_ISSUER:?Set the OIDC issuer}"
      OAUTH2_PROXY_CLIENT_ID: "${QODEX_OIDC_CLIENT_ID:?Set the OIDC client ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${QODEX_OIDC_CLIENT_SECRET:?Set the OIDC client secret}"
      OAUTH2_PROXY_COOKIE_SECRET: "${QODEX_OIDC_COOKIE_SECRET:?Set the cookie secret}"
      OAUTH2_PROXY_EMAIL_DOMAINS: "${QODEX_EMAIL_DOMAIN:?Set the corporate email domain}"
      OAUTH2_PROXY_REDIRECT_URL: "https://${QODEX_DOMAIN}/oauth2/callback"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
